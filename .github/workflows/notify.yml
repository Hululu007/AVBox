name: Release Notification

on:
  release:
    types: [published]

jobs:
  notify-on-release:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        uses: cbrgm/telegram-github-action@v1
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread-id: ${{ secrets.TELEGRAM_THREAD_ID }} # 这里会自动读取你刚设置的 2
          message: |
            🚀 新版本发布!
            名称: ${{ github.event.release.name }}
            标签: ${{ github.event.release.tag_name }}
            仓库: ${{ github.repository }}
            发布者: ${{ github.actor }}
            查看: ${{ github.event.release.html_url }}
          parse-mode: markdown
          disable-web-page-preview: true
